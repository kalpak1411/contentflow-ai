<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — ContentFlow AI</title>
  <link rel="icon" type="image/svg+xml" href="/static/images/favicon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <link rel="stylesheet" href="/static/css/main.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <link rel="stylesheet" href="/static/css/responsive.css">
</head>
<body style="background-color: var(--bg-body); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1.5rem; text-align: center;">

  <div class="card" style="width: 100%; max-width: 520px; padding: 3rem 2rem;">
    <div style="font-size: 4rem; color: var(--primary); margin-bottom: 1rem;">
      <i class="bi bi-compass"></i>
    </div>
    <h1 style="font-size: 2rem; font-weight: 800; color: var(--text-primary); margin-bottom: 0.5rem;">404 - Page Not Found</h1>
    <p style="color: var(--text-secondary); font-size: 1rem; line-height: 1.6; margin-bottom: 2rem;">
      The page or workspace view you are attempting to reach does not exist or has been relocated.
    </p>

    <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
      <a href="{% url 'dashboard' %}" class="btn btn-primary">
        <i class="bi bi-grid-1x2"></i> Return to Dashboard
      </a>
      <a href="{% url 'landing' %}" class="btn btn-secondary">
        <i class="bi bi-house"></i> Home Page
      </a>
    </div>
  </div>

</body>
</html>
