<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — ContentFlow AI</title>
  <link rel="icon" type="image/svg+xml" href="/static/images/favicon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <link rel="stylesheet" href="/static/css/main.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <link rel="stylesheet" href="/static/css/responsive.css">
</head>
<body style="background-color: var(--bg-body); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1.5rem;">

  <div class="card" style="width: 100%; max-width: 440px; padding: 2.5rem 2rem;">
    <div style="text-align: center; margin-bottom: 2rem;">
      <a href="{% url 'landing' %}" style="display: inline-flex; align-items: center; gap: 0.75rem; color: var(--text-primary); font-weight: 700; font-size: 1.25rem;">
        <img src="/static/images/logo.svg" alt="ContentFlow AI Logo" width="36" height="36">
        <span>ContentFlow AI</span>
      </a>
      <h2 style="font-size: 1.35rem; font-weight: 700; margin-top: 1rem; color: var(--text-primary);">Demo Environment Sign In</h2>
      <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 0.25rem;">Enter demo credentials or use 1-click access</p>
    </div>

    <!-- Demo Banner Notice -->
    <div class="demo-banner">
      <i class="bi bi-info-circle-fill"></i>
      <div>
        <strong>Demonstration Notice:</strong> This is a browser-only demo. Real server authentication is disabled.
      </div>
    </div>

    <!-- Error Alert Box -->
    <div id="authErrorAlert" class="demo-banner" style="display: none; background: var(--danger-bg); border-color: #fca5a5; color: #b91c1c;"></div>

    <form id="loginForm">
      <div class="form-group">
        <label class="form-label" for="emailInput">Demo Email Address</label>
        <input type="email" id="emailInput" class="form-control" value="demo@contentflow.ai" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="passwordInput">Password</label>
        <input type="password" id="passwordInput" class="form-control" value="Demo@123" required>
        <div class="form-hint">Default demo password: <code>Demo@123</code></div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 0.75rem; margin-top: 1.75rem;">
        <button type="submit" class="btn btn-primary" style="width: 100%;">
          <i class="bi bi-box-arrow-in-right"></i> Sign In
        </button>
        <button type="button" id="tryDemoBtn" class="btn btn-secondary" style="width: 100%;">
          <i class="bi bi-lightning-charge-fill" style="color: #f59e0b;"></i> Try Demo Account (1-Click)
        </button>
      </div>
    </form>

    <div style="margin-top: 2rem; text-align: center; font-size: 0.85rem; color: var(--text-muted); border-top: 1px solid var(--border-color); padding-top: 1.25rem;">
      Need to simulate a new account? <a href="{% url 'register' %}" style="font-weight: 600;">Create demo profile</a>
    </div>
  </div>

  <script src="/static/js/demo-data.js"></script>
  <script src="/static/js/storage.js"></script>
  <script src="/static/js/app.js"></script>
  <script src="/static/js/auth.js"></script>
</body>
</html>
