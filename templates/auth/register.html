<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulate Registration — ContentFlow AI</title>
  <link rel="icon" type="image/svg+xml" href="/static/images/favicon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <link rel="stylesheet" href="/static/css/main.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <link rel="stylesheet" href="/static/css/responsive.css">
</head>
<body style="background-color: var(--bg-body); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1.5rem;">

  <div class="card" style="width: 100%; max-width: 440px; padding: 2.5rem 2rem;">
    <div style="text-align: center; margin-bottom: 2rem;">
      <a href="{% url 'landing' %}" style="display: inline-flex; align-items: center; gap: 0.75rem; color: var(--text-primary); font-weight: 700; font-size: 1.25rem;">
        <img src="/static/images/logo.svg" alt="ContentFlow AI Logo" width="36" height="36">
        <span>ContentFlow AI</span>
      </a>
      <h2 style="font-size: 1.35rem; font-weight: 700; margin-top: 1rem; color: var(--text-primary);">Create Demo Account</h2>
      <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 0.25rem;">Experience full platform capabilities locally</p>
    </div>

    <div class="demo-banner">
      <i class="bi bi-info-circle-fill"></i>
      <div>
        <strong>Local Simulation:</strong> Registration will create a simulated session in your browser's localStorage.
      </div>
    </div>

    <div id="authErrorAlert" class="demo-banner" style="display: none; background: var(--danger-bg); border-color: #fca5a5; color: #b91c1c;"></div>

    <form id="registerForm">
      <div class="form-group">
        <label class="form-label" for="regNameInput">Your Name / Title</label>
        <input type="text" id="regNameInput" class="form-control" placeholder="e.g. Sarah Jenkins" value="Sarah Jenkins" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="regEmailInput">Work Email</label>
        <input type="email" id="regEmailInput" class="form-control" placeholder="sjenkins@company.com" value="sjenkins@company.com" required>
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" value="Password@123" required>
        <div class="form-hint">Any password works in local simulation mode.</div>
      </div>

      <div style="margin-top: 1.75rem;">
        <button type="submit" class="btn btn-primary" style="width: 100%;">
          <i class="bi bi-person-check-fill"></i> Complete Setup & Open Workspace
        </button>
      </div>
    </form>

    <div style="margin-top: 2rem; text-align: center; font-size: 0.85rem; color: var(--text-muted); border-top: 1px solid var(--border-color); padding-top: 1.25rem;">
      Already have a demo account? <a href="{% url 'login' %}" style="font-weight: 600;">Sign in directly</a>
    </div>
  </div>

  <script src="/static/js/demo-data.js"></script>
  <script src="/static/js/storage.js"></script>
  <script src="/static/js/app.js"></script>
  <script src="/static/js/auth.js"></script>
</body>
</html>
